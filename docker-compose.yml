version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80"
    depends_on:
      - php
    networks:
      - internal

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-motaparfum_db}
      - DB_USER=${DB_USER:-user}
      - DB_PASS=${DB_PASS:-password}
    depends_on:
      - db
    networks:
      - internal

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_DATABASE=${DB_NAME:-motaparfum_db}
      - MYSQL_USER=${DB_USER:-user}
      - MYSQL_PASSWORD=${DB_PASS:-password}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - internal

networks:
  internal:


volumes:
  db_data:
